<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pūtea Shift Log</title>
<style>
  html{ color-scheme:light; background:#ECEAE3; }
  :root{
    --paper:#ECEAE3; --paper-alt:#E1DDD0; --ink:#20242B; --ink-soft:#4B4F56;
    --rule:#C7C1B2; --amber:#B06F00; --amber-fill:#C97F00; --amber-bg:#F3DFB2;
    --red:#A8402F; --green:#3F7859; --blue:#1A5E8A;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 70px;}
  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  header h1{font-size:25px;font-weight:700;margin:0 0 3px;letter-spacing:-0.2px;}
  header .sub{font-size:16px;color:var(--ink-soft);margin:0;}
  .sync-pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--rule);background:var(--paper-alt);font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;cursor:pointer;flex-shrink:0;margin-top:2px;}
  .sync-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--rule);flex-shrink:0;}
  .sync-pill.ok .dot{background:var(--green);}
  .sync-pill.busy .dot{background:var(--amber-fill);animation:pulse 1s infinite;}
  .sync-pill.err .dot{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .weeknav button{background:var(--paper);border:1px solid var(--rule);width:44px;height:44px;font-size:20px;color:var(--ink);cursor:pointer;}
  .weeknav .range{font-size:16px;color:var(--ink-soft);text-align:center;flex:1;}
  .hero{background:var(--paper-alt);border:1px solid var(--rule);padding:20px 18px 18px;margin-bottom:16px;}
  .hero .amount{font-family:var(--mono);font-size:52px;font-weight:700;letter-spacing:-1px;line-height:1;}
  .hero .caption{font-size:17px;font-weight:600;margin-top:8px;font-family:var(--mono);}
  .track{height:10px;background:#D8D3C4;margin-top:12px;overflow:hidden;}
  .track .fill{height:100%;background:var(--amber-fill);}
  .track .fill.good{background:var(--green);}
  .hero .subline{font-size:16px;margin-top:12px;font-family:var(--mono);}
  .day-row{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 2px;border-top:1px dashed var(--rule);cursor:pointer;}
  .day-row:first-of-type{border-top:1px solid var(--rule);}
  .day-left .wk{font-weight:700;font-size:19px;}
  .day-left .dt{font-size:16px;margin-top:1px;}
  .day-right{text-align:right;}
  .day-right .tot{font-family:var(--mono);font-weight:700;font-size:23px;}
  .day-right .meta{font-family:var(--mono);font-size:16px;margin-top:4px;}
  .day-right .promo{font-size:15px;font-weight:700;color:var(--amber);margin-top:4px;}
  .not-logged{font-size:16px;color:var(--amber);font-style:italic;}
  .day-off{font-size:17px;color:var(--ink-soft);font-style:italic;}
  .day-off-note{font-size:14px;color:var(--ink-soft);margin-top:4px;}
  .form{padding:16px 4px 20px;border-top:1px dashed var(--rule);background:rgba(255,255,255,0.35);}
  .form label{display:block;font-size:14.5px;color:var(--ink-soft);margin:12px 0 5px;}
  .form input{width:100%;font-family:var(--mono);font-size:19px;padding:11px 10px;border:1px solid var(--rule);background:#fff;color:var(--ink);}
  .row2{display:flex;gap:8px;} .row2>div{flex:1;}
  .kmpreview{font-family:var(--mono);font-size:15px;color:var(--amber);text-align:right;margin-top:5px;min-height:19px;}
  .btnrow{display:flex;gap:8px;margin-top:18px;}
  .btn{flex:1;padding:14px 0;text-align:center;font-family:var(--sans);font-size:17px;font-weight:600;border:1px solid var(--ink);background:none;color:var(--ink);cursor:pointer;}
  .btn.primary{background:var(--ink);color:var(--paper);}
  .btn.plain{border-color:transparent;color:var(--ink-soft);font-weight:500;}
  .delrow{margin-top:14px;text-align:right;}
  .del{background:none;border:none;font-size:15px;color:var(--red);font-weight:600;padding:8px 0;cursor:pointer;}
  .settings{margin-top:20px;padding-top:16px;border-top:1px solid var(--rule);font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
  .settings .change,.export{background:none;border:none;color:var(--amber);font-weight:600;font-size:15px;padding:0;cursor:pointer;}
  .settings input{font-family:var(--mono);font-size:17px;padding:8px;border:1px solid var(--rule);width:90px;background:#fff;color:var(--ink);}
  .ytd{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--ink-soft);padding:10px 2px 16px;border-bottom:1px solid var(--rule);margin-bottom:10px;font-family:var(--mono);}
  .ytd .lbl{font-family:var(--sans);}
  .ytd .figs span{margin-left:12px;color:var(--ink);font-weight:700;font-size:16px;}
  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab{flex:1;padding:12px 0;text-align:center;font-size:16px;font-weight:600;border:1px solid var(--rule);background:var(--paper);color:var(--ink-soft);cursor:pointer;}
  .tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .panel{background:var(--paper-alt);border:1px solid var(--rule);padding:18px;margin-bottom:16px;}
  .panel-label{font-size:14.5px;color:var(--ink-soft);margin-bottom:8px;}
  .panel-figs{font-family:var(--mono);font-size:28px;font-weight:700;}
  .panel-figs .of{font-size:16px;font-weight:500;color:var(--ink-soft);font-family:var(--sans);margin-left:6px;}
  .panel-caption{font-family:var(--mono);font-size:15px;margin-top:10px;}
  .attend-row{display:flex;justify-content:space-between;margin-top:4px;}
  .attend-stat{text-align:center;flex:1;}
  .attend-stat .n{font-family:var(--mono);font-size:26px;font-weight:700;}
  .attend-stat .l{font-size:14px;color:var(--ink-soft);margin-top:3px;}
  .weekbar{margin-bottom:16px;}
  .weekbar-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:16px;font-weight:600;margin-bottom:6px;}
  .notefield{margin-top:14px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;font-size:15px;font-weight:600;border-radius:4px;z-index:999;opacity:0;transition:opacity 0.3s;}
  .toast.show{opacity:1;}
  input[type=time]::-webkit-datetime-edit-ampm-field{display:none;}
</style>
</head>

// ── Supabase helpers ───────────────────────────────────────────────────────
function toRow(e){
  return {
    date: e.date,
    day_off: e.day_off||e.dayOff||false,
    rdo: e.rdo||false,
    start_time: e.start_time||e.startTime||null,
    start_km: e.start_km??e.startKm??null,
    end_km: e.end_km??e.endKm??null,
    online_hours: e.online_hours??e.onlineHours??0,
    online_minutes: e.online_minutes??e.onlineMinutes??0,
    trips: e.trips||0,
    net_fare: e.net_fare??e.netFare??0,
    promotions: e.promotions||0,
    tips: e.tips||0,
    note: e.note||null
  };
}

function fromRow(r){
  return {
    date: r.date, dayOff: r.day_off, rdo: r.rdo,
    startTime: r.start_time, startKm: r.start_km, endKm: r.end_km,
    onlineHours: r.online_hours, onlineMinutes: r.online_minutes,
    trips: r.trips, netFare: r.net_fare, promotions: r.promotions,
    tips: r.tips, note: r.note
  };
}

async function loadFromSupabase(){
  setPill('busy','Loading…');
  try {
    const rows = await supa('GET','shifts?select=*&order=date.asc');
    if(rows.length === 0){
      // First time — seed the database
      setPill('busy','Seeding data…');
      await seedDatabase();
    } else {
      entries = rows.map(fromRow);
    }
    synced = true;
    setPill('ok','Synced ✓');
  } catch(e){
    setPill('err','Offline');
    toast('Could not connect — check internet');
  }
}

async function seedDatabase(){
  // Insert all historical data in batches of 20
  const rows = SEED.map(toRow);
  for(let i=0;i<rows.length;i+=20){
    await supa('POST','shifts',rows.slice(i,i+20));
  }
  entries = SEED.map(fromRow);
}

async function saveToSupabase(entry){
  setPill('busy','Saving…');
  try {
    await supa('POST','shifts',[toRow(entry)]);
    setPill('ok','Synced ✓');
    return true;
  } catch(e){
    setPill('err','Save failed');
    toast('Save failed — check internet');
    return false;
  }
}

async function deleteFromSupabase(date){
  setPill('busy','Deleting…');
  try {
    await supa('DELETE','shifts?date=eq.'+date);
    setPill('ok','Synced ✓');
    return true;
  } catch(e){
    setPill('err','Delete failed');
    return false;
  }
}

async function syncNow(){
  await loadFromSupabase();
  render();
}

// ── Helpers ────────────────────────────────────────────────────────────────
function pad(n){return n.toString().padStart(2,'0');}
function toISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseISO(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function taxYearStart(d){const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return new Date(y,3,1);}
function startOfWeek(d){const day=d.getDay();const diff=day===0?-6:1-day;const m=new Date(d);m.setDate(d.getDate()+diff);m.setHours(0,0,0,0);return m;}
function addDays(d,n){const r=new Date(d);r.setDate(d.getDate()+n);return r;}
function fmtWeekday(d){return d.toLocaleDateString('en-NZ',{weekday:'short'});}
function fmtDayMonth(d){return d.getDate()+' '+d.toLocaleDateString('en-NZ',{month:'short'});}
function money(n,dec){dec=dec===undefined?2:dec;const v=Number(n)||0;const a=Math.abs(v).toFixed(dec);const p=a.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return(v<0?'-$':'$')+p.join('.');}
function hoursLabel(h){const m=Math.round((h||0)*60);return Math.floor(m/60)+'h'+pad(m%60)+'m';}

function computeDerived(e){
  const online=(e.onlineHours||0)+(e.onlineMinutes||0)/60;
  const total=(e.netFare||0)+(e.promotions||0)+(e.tips||0);
  const dist=(e.startKm!=null&&e.endKm!=null&&e.endKm>e.startKm)?e.endKm-e.startKm:null;
  return{online,total,hourly:online>0?total/online:0,dist,perKm:dist?total/dist:null};
}

function weekAgg(arr){
  let h=0,t=0,f=0,p=0,ti=0,d=0;
  arr.forEach(e=>{h+=(e.onlineHours||0)+(e.onlineMinutes||0)/60;t+=e.trips||0;f+=e.netFare||0;p+=e.promotions||0;ti+=e.tips||0;if(e.startKm&&e.endKm&&e.endKm>e.startKm)d+=e.endKm-e.startKm;});
  const total=f+p+ti;
  return{sumOnline:h,sumTrips:t,sumDistance:d,total,hourly:h>0?total/h:0,perKm:d>0?total/d:null};
}

function computeAttendance(from){
  const today=new Date();today.setHours(0,0,0,0);
  const total=Math.floor((today-from)/864e5)+1;
  let worked=0,off=0,rdo=0;
  entries.forEach(e=>{const d=parseISO(e.date);if(d>=from&&d<=today){if(e.rdo)rdo++;else if(e.dayOff)off++;else worked++;}});
  return{worked,off,rdo,notLogged:Math.max(total-worked-off-rdo,0)};
}

function toggleEditTarget(){editingTarget=!editingTarget;render();}

async function saveTarget(){
  const v=parseFloat(document.getElementById('in-target').value);
  if(!isNaN(v)&&v>0)settings.weeklyTarget=v;
  editingTarget=false;render();
}

async function saveDay(date){
  const typeEl=document.getElementById('day-type-value');
  const dayType=typeEl?typeEl.value:'worked';
  const note=document.getElementById('in-note').value||null;
  let entry;
  if(dayType==='rdo'){entry={date,rdo:true,dayOff:false,note};}
  else if(dayType==='leave'){entry={date,dayOff:true,rdo:false,note};}
  else{entry={date,dayOff:false,rdo:false,startTime:document.getElementById('in-starttime').value||null,startKm:numOrNull('in-startkm'),endKm:numOrNull('in-endkm'),onlineHours:numOrZero('in-hours'),onlineMinutes:numOrZero('in-mins'),trips:Math.round(numOrZero('in-trips')),netFare:numOrZero('in-fare'),promotions:numOrZero('in-promo'),tips:numOrZero('in-tips'),note};}
  const ok=await saveToSupabase(entry);
  if(ok){
    entries=entries.filter(e=>e.date!==date);
    entries.push(entry);
    entries.sort((a,b)=>a.date.localeCompare(b.date));
    activeDate=null;
    toast('Saved ✓');
  }
  render();
}

function askDelete(date){if(pendingDelete===date){deleteDay(date);}else{pendingDelete=date;render();}}

async function deleteDay(date){
  const ok=await deleteFromSupabase(date);
  if(ok){entries=entries.filter(e=>e.date!==date);pendingDelete=null;activeDate=null;toast('Deleted');}
  render();
}

function numOrZero(id){const el=document.getElementById(id);return(!el||el.value==='')?0:parseFloat(el.value);}
function numOrNull(id){const el=document.getElementById(id);return(!el||el.value==='')?null:parseFloat(el.value);}
function updateKmPreview(){const s=document.getElementById('in-startkm').value;const e=document.getElementById('in-endkm').value;const pr=document.getElementById('km-preview');if(!pr)return;if(!s||!e){pr.textContent='';return;}const d=parseFloat(e)-parseFloat(s);pr.textContent=d>=0?d+' km':'Finish should be more than start';}

}

function exportCSV(){
  const rows=[['Date','Type','Start time','Start km','Finish km','Distance km','Hours','Minutes','Trips','Net fare','Promotions','Tips','Total','Notes']];
  entries.forEach(e=>{const type=e.rdo?'RDO':e.dayOff?'Leave':'Worked';const der=computeDerived(e);rows.push([e.date,type,e.startTime||'',e.startKm!=null?e.startKm:'',e.endKm!=null?e.endKm:'',der.dist!=null?der.dist:'',e.onlineHours||0,e.onlineMinutes||0,e.trips||0,(e.netFare||0).toFixed(2),(e.promotions||0).toFixed(2),(e.tips||0).toFixed(2),der.total.toFixed(2),e.note?'"'+e.note.replace(/"/g,'""')+'"':'']);});
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='putea-shift-log.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

    <div class="attend-stat"><div class="n" style="font-size:22px;">${money(ytd.hourly,2)}</div><div class="l">per hour</div></div>
    <div class="attend-stat"><div class="n" style="font-size:22px;">${att.worked>0?money(ytd.total/att.worked,0):'—'}</div><div class="l">per shift</div></div>
    <div class="attend-stat"><div class="n" style="font-size:22px;">${ytd.sumOnline>0?(ytd.sumTrips/ytd.sumOnline).toFixed(1):'—'}</div><div class="l">trips/hr</div></div>
    <div class="attend-stat"><div class="n" style="font-size:22px;">${ytd.perKm?money(ytd.perKm):'—'}</div><div class="l">per km</div></div>
  </div></div>`;
  h+=`<div class="panel"><div class="panel-label">${mLabel}</div><div class="panel-figs">${money(mAgg.total,0)} <span class="of">${mE.length} days · ${mAgg.sumTrips} trips</span></div><div class="track"><div class="fill${mPct>=100?' good':''}" style="width:${mPct}%"></div></div><div style="display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:14px;"><span>${money(mAgg.hourly)}/hr</span><span>${mE.length>0?money(mAgg.total/mE.length,0):'—'}/shift</span><span>${mAgg.sumOnline>0?(mAgg.sumTrips/mAgg.sumOnline).toFixed(1):'—'} t/hr</span><span>${Math.round(mAgg.sumDistance).toLocaleString()} km</span></div></div>`;
  h+=`<div class="panel"><div class="panel-label">Weekly average (${driveWeeks} weeks driven)</div><div class="panel-figs">${money(avgWeekly,0)} <span class="of">avg per week</span></div><div class="track"><div class="fill${avgWeekly>=BREAK?' good':''}" style="width:${Math.min(100,Math.round((avgWeekly/BREAK)*100))}%"></div></div><div style="display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:14px;"><span>${money(dailyAvg,0)}/day</span><span style="color:var(--green);">${weeksAbove} wks above</span><span style="color:var(--red);">${weeksBelow} wks below</span></div></div>`;
  h+=`<div class="panel"><div class="panel-label">Leave entitlement (Mon–Sat)</div><div class="panel-figs">${leaveLeft} <span class="of">days remaining of ${maxDaysOff}</span></div><div class="track"><div class="fill${leavePct>=80?'':' good'}" style="width:${leavePct}%"></div></div><div style="margin-top:12px;font-family:var(--mono);font-size:14px;">
    <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>Leave taken</span><span>${leaveTaken} days</span></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>Remaining</span><span>${leaveLeft} days · ${(leaveLeft/6).toFixed(1)} wks</span></div>
    <div style="display:flex;justify-content:space-between;padding-top:8px;border-top:1px dashed var(--rule);color:var(--ink-soft);"><span>Cost of 1 week off</span><span>${money(dailyAvg*6,0)}</span></div>
    <div style="display:flex;justify-content:space-between;margin-top:4px;color:var(--ink-soft);"><span>Min days/wk to break even</span><span>${dailyAvg>0?Math.ceil(BREAK/dailyAvg):'-'} days</span></div>
  </div></div>`;
  h+=`<div class="panel"><div class="panel-label">IRD Tier 1 km threshold</div><div class="panel-figs">${Math.round(ytd.sumDistance).toLocaleString()} km <span class="of">of ${KM_TIER1.toLocaleString()}</span></div><div class="track"><div class="fill" style="width:${kmPct}%"></div></div><div class="panel-caption">${Math.round(kmLeft).toLocaleString()} km remaining at $1.17</div></div>`;
  h+=`<div class="panel"><div class="panel-label">Days since 1 Apr ${tys.getFullYear()}</div><div class="attend-row">
    <div class="attend-stat"><div class="n">${att.worked}</div><div class="l">Worked</div></div>
    <div class="attend-stat"><div class="n" style="color:var(--blue);">${att.rdo}</div><div class="l">RDO</div></div>
    <div class="attend-stat"><div class="n" style="color:var(--amber);">${att.off}</div><div class="l">Leave</div></div>
    <div class="attend-stat"><div class="n" style="color:var(--ink-soft);font-size:20px;">${att.notLogged}</div><div class="l">Not logged</div></div>
  </div></div>`;
  h+=`<div class="panel-label" style="margin:22px 2px 10px;">Last 4 weeks</div>`;
  weeks4.forEach(w=>{h+=`<div class="weekbar"><div class="weekbar-top"><span>${w.label}</span><span>${money(w.total,0)}</span></div><div class="track"><div class="fill${w.pct>=100?' good':''}" style="width:${Math.min(100,w.pct)}%"></div></div></div>`;});
  h+=`<div class="panel-label" style="margin:22px 2px 10px;">Monthly history</div>`;
  months6.forEach(m=>{const avg=m.daysWorked>0?money(m.total/m.daysWorked,0):'—';h+=`<div class="weekbar"><div class="weekbar-top"><span>${m.label}${m.isCurrent?' <span style="color:var(--amber);font-size:13px;">now</span>':''}</span><span>${money(m.total,0)}</span></div><div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--ink-soft);margin-bottom:8px;"><span>${money(m.hourly)}/hr</span><span>${avg}/shift</span><span>${m.sumTrips} trips</span><span>${Math.round(m.sumDistance).toLocaleString()} km</span></div></div>`;});
  return h;
}

// ── Render ─────────────────────────────────────────────────────────────────
function render(){
  const tys=taxYearStart(new Date());
  const ytdE=entries.filter(e=>parseISO(e.date)>=tys&&!e.dayOff&&!e.rdo);
  const ytd=weekAgg(ytdE);
  let html='';
  html+=`<div class="ytd"><span class="lbl">Since 1 Apr ${tys.getFullYear()}</span><span class="figs"><span>${Math.round(ytd.sumDistance)} km</span><span>${ytd.sumTrips} trips</span><span>${money(ytd.total,0)}</span></span></div>`;
  html+=`<div class="tabs"><button class="tab ${view==='week'?'active':''}" onclick="setView('week')">This week</button><button class="tab ${view==='dashboard'?'active':''}" onclick="setView('dashboard')">Dashboard</button></div>`;

  if(view==='dashboard'){
    html+=renderDashboard();
  } else {
    const weekDates=[];for(let i=0;i<7;i++)weekDates.push(toISO(addDays(weekStart,i)));
    const wE=entries.filter(e=>weekDates.includes(e.date));
    const agg=weekAgg(wE.filter(e=>!e.dayOff&&!e.rdo));
    const target=settings.weeklyTarget||501;
    const pct=Math.round((agg.total/target)*100);
    html+=`<div class="weeknav"><button onclick="changeWeek(-1)">‹</button><div class="range">Week of ${fmtDayMonth(weekStart)} – ${fmtDayMonth(addDays(weekStart,6))}</div><button onclick="changeWeek(1)">›</button></div>`;
    html+=`<div class="hero"><div class="amount">${money(agg.total,0)}</div><div class="caption">${money(agg.total)} of ${money(target,0)} target · ${pct}%</div><div class="track"><div class="fill${pct>=100?' good':''}" style="width:${Math.min(100,pct)}%"></div></div><div class="subline">${agg.sumTrips} trips · ${hoursLabel(agg.sumOnline)} online · ${money(agg.hourly)}/hr avg</div>${agg.sumDistance>0?`<div class="subline">${Math.round(agg.sumDistance)} km · ${agg.perKm?money(agg.perKm)+'/km':''}</div>`:''}</div>`;
    weekDates.forEach(date=>{
      const d=parseISO(date);const entry=wE.find(e=>e.date===date);
      const wk=fmtWeekday(d);const dt=fmtDayMonth(d);
      if(entry&&entry.rdo){
        html+=`<div class="day-row" onclick="openDay('${date}')"><div class="day-left"><div class="wk">${wk}</div><div class="dt">${dt}</div></div><div class="day-right"><div class="day-off" style="color:var(--blue);">RDO</div>${entry.note?`<div class="day-off-note">${entry.note}</div>`:''}</div></div>`;
        if(activeDate===date)html+=formHtml(date,entry);
      }else if(entry&&entry.dayOff){
        html+=`<div class="day-row" onclick="openDay('${date}')"><div class="day-left"><div class="wk">${wk}</div><div class="dt">${dt}</div></div><div class="day-right"><div class="day-off">Leave Day</div>${entry.note?`<div class="day-off-note">${entry.note}</div>`:''}</div></div>`;
        if(activeDate===date)html+=formHtml(date,entry);
      }else if(entry){
        const der=computeDerived(entry);
        html+=`<div class="day-row" onclick="openDay('${date}')"><div class="day-left"><div class="wk">${wk}</div><div class="dt">${dt}</div></div><div class="day-right"><div class="tot">${money(der.total)}</div><div class="meta">${entry.trips||0} trips · ${hoursLabel(der.online)} · ${money(der.hourly)}/hr</div>${der.dist?`<div class="meta">${der.dist} km · ${der.perKm?money(der.perKm)+'/km':''}</div>`:''}${entry.promotions?`<div class="promo">+${money(entry.promotions)} promo</div>`:''}</div></div>`;
        if(activeDate===date)html+=formHtml(date,entry);
      }else{
        html+=`<div class="day-row" onclick="openDay('${date}')"><div class="day-left"><div class="wk">${wk}</div><div class="dt">${dt}</div></div><div class="day-right"><div class="not-logged">Log this day</div></div></div>`;
        if(activeDate===date)html+=formHtml(date,null);
      }
    });
  }

  html+=`<div class="settings">${editingTarget?`<span>Weekly target <input type="number" id="in-target" value="${settings.weeklyTarget||501}"></span><button class="change" onclick="saveTarget()">Save</button>`:`<span>Weekly target ${money(settings.weeklyTarget||501,0)}</span><button class="change" onclick="toggleEditTarget()">Change</button>`}</div>`;
  html+=`<div class="settings"><span>${entries.length} days logged</span><button class="export" onclick="exportCSV()">Export CSV</button></div>`;
  document.getElementById('app').innerHTML=html;
}

// ── Init ───────────────────────────────────────────────────────────────────
(async function(){
  await loadFromSupabase();
  render();
})();
</script>
</body>
</html>
