<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Pūtea Shift Log</title>
<style>
  html{ color-scheme: light; background: #ECEAE3; }
  :root{
    --paper: #ECEAE3;
    --paper-alt: #E1DDD0;
    --ink: #20242B;
    --ink-soft: #4B4F56;
    --rule: #C7C1B2;
    --amber: #B06F00;
    --amber-fill: #C97F00;
    --amber-bg: #F3DFB2;
    --red: #A8402F;
    --green: #3F7859;
    --blue: #1A5E8A;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    color-scheme: light;
    font-family:var(--sans);
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 70px;background:var(--paper);}
  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  header .titles h1{font-size:25px;font-weight:700;margin:0 0 3px;letter-spacing:-0.2px;}
  header .titles .sub{font-size:16px;color:var(--ink-soft);margin:0;}

  /* Drive sync pill */
  .sync-pill{
    display:flex;align-items:center;gap:6px;
    padding:6px 10px;
    border:1px solid var(--rule);
    background:var(--paper-alt);
    font-size:13px;font-weight:600;color:var(--ink-soft);
    white-space:nowrap;cursor:pointer;flex-shrink:0;
    margin-top:2px;
  }
  .sync-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--rule);flex-shrink:0;}
  .sync-pill.connected .dot{background:var(--green);}
  .sync-pill.syncing .dot{background:var(--amber-fill);animation:pulse 1s infinite;}
  .sync-pill.error .dot{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  /* Drive banner */
  .drive-banner{
    background:var(--amber-bg);
    border:1px solid var(--amber-fill);
    padding:14px 14px;
    margin-bottom:16px;
    font-size:15px;
    color:var(--ink);
  }
  .drive-banner strong{display:block;margin-bottom:6px;font-size:16px;}
  .drive-banner .btn-row{display:flex;gap:8px;margin-top:10px;}
  .drive-connect-btn{
    padding:10px 16px;font-size:15px;font-weight:700;
    background:var(--ink);color:var(--paper);border:none;
    font-family:var(--sans);cursor:pointer;
  }
  .drive-dismiss{
    padding:10px 12px;font-size:15px;font-weight:600;
    background:none;color:var(--ink-soft);border:1px solid var(--rule);
    font-family:var(--sans);cursor:pointer;
  }
  .drive-status-row{
    display:flex;justify-content:space-between;align-items:center;
    font-size:14px;color:var(--ink-soft);font-family:var(--mono);
    padding:8px 2px;margin-bottom:10px;
    border-bottom:1px dashed var(--rule);
  }
  .drive-status-row .sync-now{
    background:none;border:none;color:var(--amber);
    font-size:14px;font-weight:600;font-family:var(--sans);padding:0;cursor:pointer;
  }

  .weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;background:var(--paper);}
  .weeknav button{
    background:var(--paper);border:1px solid var(--rule);border-radius:0;
    width:44px;height:44px;font-size:20px;color:var(--ink);
    font-family:var(--mono);
  }
  .weeknav .range{font-size:16px;color:var(--ink-soft);text-align:center;flex:1;}

  .hero{
    background:var(--paper-alt);
    border:1px solid var(--rule);
    padding:20px 18px 18px;
    margin-bottom:16px;
  }
  .hero .amount{
    font-family:var(--mono);
    font-size:52px;
    font-weight:700;
    letter-spacing:-1px;
    line-height:1;
  }
  .hero .caption{
    font-size:17px;font-weight:600;color:var(--ink);margin-top:8px;font-family:var(--mono);
  }
  .track{height:10px;background:#D8D3C4;margin-top:12px;position:relative;overflow:hidden;}
  .track .fill{height:100%;background:var(--amber-fill);}
  .track .fill.good{background:var(--green);}
  .hero .subline{font-size:16px;color:var(--ink);margin-top:12px;font-family:var(--mono);}

  .day-row{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:16px 2px;border-top:1px dashed var(--rule);background:var(--paper);cursor:pointer;
  }
  .day-row:first-of-type{border-top:1px solid var(--rule);}
  .day-left .wk{font-weight:700;font-size:19px;color:var(--ink);}
  .day-left .dt{font-size:16px;color:var(--ink);margin-top:1px;}
  .day-right{text-align:right;}
  .day-right .tot{font-family:var(--mono);font-weight:700;font-size:23px;}
  .day-right .meta{font-family:var(--mono);font-size:16px;color:var(--ink);margin-top:4px;}
  .day-right .promo{font-size:15px;font-weight:700;color:var(--amber);margin-top:4px;}
  .not-logged{font-size:16px;color:var(--amber);font-style:italic;}

  .form{padding:16px 4px 20px;border-top:1px dashed var(--rule);background:rgba(255,255,255,0.35);}
  .form label{display:block;font-size:14.5px;color:var(--ink-soft);margin:12px 0 5px;}
  .form input{
    width:100%;font-family:var(--mono);font-size:19px;padding:11px 10px;
    border:1px solid var(--rule);background:#fff;color:var(--ink);
  }
  .row2{display:flex;gap:8px;}
  .row2 > div{flex:1;}
  .kmpreview{font-family:var(--mono);font-size:15px;color:var(--amber);text-align:right;margin-top:5px;min-height:19px;}
  .btnrow{display:flex;gap:8px;margin-top:18px;}
  .btn{
    flex:1;padding:14px 0;text-align:center;font-family:var(--sans);
    font-size:17px;font-weight:600;border:1px solid var(--ink);background:none;color:var(--ink);
  }
  .btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn.plain{border-color:transparent;color:var(--ink-soft);font-weight:500;}
  .delrow{margin-top:14px;text-align:right;}
  .del{background:none;border:none;font-size:15px;color:var(--red);font-weight:600;padding:8px 0;}

  .settings{
    margin-top:28px;padding-top:16px;border-top:1px solid var(--rule);
    font-size:16px;font-weight:600;color:var(--ink);background:var(--paper);
    display:flex;justify-content:space-between;align-items:center;
  }
  .settings .change{background:none;border:none;color:var(--amber);font-weight:600;font-size:15px;padding:0;}
  .settings input{
    font-family:var(--mono);font-size:17px;padding:8px;
    border:1px solid var(--rule);width:90px;background:#fff;color:var(--ink);
  }
  .ytd{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:15px;color:var(--ink-soft);padding:10px 2px 16px;
    border-bottom:1px solid var(--rule);margin-bottom:10px;
    background:var(--paper);font-family:var(--mono);
  }
  .ytd .lbl{font-family:var(--sans);color:var(--ink-soft);}
  .ytd .figs span{margin-left:12px;color:var(--ink);font-weight:700;font-size:16px;}
  .export{background:none;border:none;color:var(--amber);font-weight:600;font-size:15px;padding:0;}
  .loading{color:var(--ink-soft);font-size:16px;padding:20px 0;}

  .tabs{display:flex;gap:8px;margin-bottom:16px;background:var(--paper);}
  .tab{
    flex:1;padding:12px 0;text-align:center;font-family:var(--sans);
    font-size:16px;font-weight:600;border:1px solid var(--rule);background:var(--paper);color:var(--ink-soft);
  }
  .tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .panel{background:var(--paper-alt);border:1px solid var(--rule);padding:18px;margin-bottom:16px;}
  .panel-label{font-size:14.5px;color:var(--ink-soft);margin-bottom:8px;}
  .panel-figs{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--ink);}
  .panel-figs .of{font-size:16px;font-weight:500;color:var(--ink-soft);font-family:var(--sans);margin-left:6px;}
  .panel-caption{font-family:var(--mono);font-size:15px;color:var(--ink);margin-top:10px;}

  .attend-row{display:flex;justify-content:space-between;margin-top:4px;}
  .attend-stat{text-align:center;flex:1;}
  .attend-stat .n{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--ink);}
  .attend-stat .l{font-size:14px;color:var(--ink-soft);margin-top:3px;}

  .weekbar{margin-bottom:16px;}
  .weekbar-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:16px;font-weight:600;color:var(--ink);margin-bottom:6px;}

  .day-off{font-size:17px;color:var(--ink-soft);font-style:italic;}
  .day-off-note{font-size:14px;color:var(--ink-soft);margin-top:4px;font-style:normal;}

  .checkrow{display:flex;align-items:center;gap:10px;margin:14px 0 6px;}
  .checkrow input[type=checkbox]{width:24px;height:24px;}
  input[type=time]{-webkit-appearance:none;appearance:none;}
  input[type=time]::-webkit-datetime-edit-ampm-field{display:none;}
  .checkrow label{margin:0;font-size:16px;color:var(--ink);}
  .notefield{margin-top:14px;}
</style>
</head>

// ── Date helpers ───────────────────────────────────────────────────────────
function pad(n){ return n.toString().padStart(2,'0'); }
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function taxYearStart(d){
  const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
  return new Date(y, 3, 1);
}
function startOfWeek(d){
  const day = d.getDay();
  const diff = (day === 0) ? -6 : (1 - day);
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  monday.setHours(0,0,0,0);
  return monday;
}
function addDays(d, n){ const r = new Date(d); r.setDate(d.getDate() + n); return r; }
function fmtWeekday(d){ return d.toLocaleDateString('en-NZ', { weekday: 'short' }); }
function fmtDayMonth(d){ return d.getDate() + ' ' + d.toLocaleDateString('en-NZ', { month: 'short' }); }
function money(n, decimals){
  decimals = (decimals===undefined) ? 2 : decimals;
  const v = Number(n) || 0;
  const abs = Math.abs(v).toFixed(decimals);
  const parts = abs.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (v < 0 ? '-$' : '$') + parts.join('.');
}
function hoursLabel(decHours){
  const totalMin = Math.round((decHours||0) * 60);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return h + 'h' + pad(m) + 'm';
}

// ── Supabase data layer ──────────────────────────────────────────────────────
async function loadData(){
  try {
    const r = await sbFetch('shifts?select=*&order=date.asc');
    const rows = await r.json();
    if (rows && rows.length > 0){
      entries = rows.map(fromRow);
    } else {
      // Empty DB — seed it
      entries = SEED_ENTRIES;
      await seedSupabase();
    }
  } catch(e){
    console.error('Load failed:', e);
    entries = SEED_ENTRIES;
  }
  // Settings from localStorage (lightweight, no Supabase table needed)
  try {
    const s = localStorage.getItem('putea-settings');
    if (s) settings = JSON.parse(s);
  } catch(e){}
}

async function seedSupabase(){
  // Insert seed data in batches of 20
  const batches = [];
  for (let i = 0; i < SEED_ENTRIES.length; i += 20) batches.push(SEED_ENTRIES.slice(i, i+20));
  for (const batch of batches){
    try {
      await sbFetch('shifts', {
        method: 'POST',
        headers: { ...SB_HDR, Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify(batch.map(toRow))
      });
    } catch(e){ console.error('Seed batch failed:', e); }
  }
}

async function persistEntries(){
  // This is now a no-op — individual saves go direct via saveDay → sbUpsert
  return true;
}

async function persistSettings(){
  try {
    localStorage.setItem('putea-settings', JSON.stringify(settings));
    return true;
  } catch(e){ alert('Settings did not save.'); return false; }
}

async function sbUpsert(entry){
  setSyncing(true);
  try {
    await sbFetch('shifts', {
      method: 'POST',
      headers: { ...SB_HDR, Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(toRow(entry))
    });
    syncState.lastSynced = new Date().toISOString();
    syncState.error = null;
  } catch(e){
    syncState.error = e.message;
    alert('Save failed: ' + e.message);
  }
  setSyncing(false);
  updateSyncPill();
}

async function sbDelete(date){
  setSyncing(true);
  try {
    await sbFetch('shifts?date=eq.' + date, { method: 'DELETE', headers: { ...SB_HDR, Prefer: 'return=minimal' } });
    syncState.lastSynced = new Date().toISOString();
    syncState.error = null;
  } catch(e){
    syncState.error = e.message;
  }
  setSyncing(false);
  updateSyncPill();
}

function setSyncing(val){ syncState.syncing = val; updateSyncPill(); }

function updateSyncPill(){
  const pill = document.getElementById('syncPill');
  const label = document.getElementById('syncPillLabel');
  if (!pill || !label) return;
  pill.className = 'sync-pill';
  if (syncState.syncing){
    pill.classList.add('syncing');
    label.textContent = 'Saving…';
  } else if (syncState.error){
    pill.classList.add('error');
    label.textContent = 'Error';
  } else if (syncState.lastSynced){
    pill.classList.add('connected');
    label.textContent = 'Saved ✓';
  } else {
    label.textContent = 'Supabase';
  }
}

// ── Computed ───────────────────────────────────────────────────────────────
function computeDerived(entry){
  const onlineDecimal = (entry.onlineHours||0) + (entry.onlineMinutes||0)/60;
  const total = (entry.netFare||0) + (entry.promotions||0) + (entry.tips||0);
  const hasDistance = (entry.startKm!=null && entry.endKm!=null && entry.endKm > entry.startKm);
  const distance = hasDistance ? (entry.endKm - entry.startKm) : null;
  return {
    onlineDecimal,
    total,
    hourly: onlineDecimal > 0 ? total / onlineDecimal : 0,
    tripsPerHr: onlineDecimal > 0 ? (entry.trips||0) / onlineDecimal : 0,
    perKm: (distance && distance > 0) ? total / distance : null,
    distance
  };
}

function weekAgg(weekEntries){
  let sumOnline=0, sumTrips=0, sumFare=0, sumPromo=0, sumTips=0, sumDistance=0;
  weekEntries.forEach(e=>{
    sumOnline += (e.onlineHours||0) + (e.onlineMinutes||0)/60;
    sumTrips  += e.trips||0;
    sumFare   += e.netFare||0;
    sumPromo  += e.promotions||0;
    sumTips   += e.tips||0;
    if (e.startKm!=null && e.endKm!=null && e.endKm > e.startKm){
      sumDistance += (e.endKm - e.startKm);
    }
  });
  const total = sumFare + sumPromo + sumTips;
  return {
    sumOnline, sumTrips, sumFare, sumPromo, sumTips, sumDistance, total,
    hourly: sumOnline > 0 ? total / sumOnline : 0,
    perKm: sumDistance > 0 ? total / sumDistance : null
  };
}

function computeAttendance(rangeStart){
  const today = new Date(); today.setHours(0,0,0,0);
  const totalDays = Math.floor((today - rangeStart) / (1000*60*60*24)) + 1;
  let worked = 0, off = 0, rdo = 0;
  entries.forEach(e => {
    const d = parseISO(e.date);
    if (d >= rangeStart && d <= today){
      if (e.rdo) rdo++;
      else if (e.dayOff) off++;
      else worked++;
    }
  });
  return { worked, off, rdo, notLogged: Math.max(totalDays - worked - off - rdo, 0), totalDays };
}

function weeksTrend(count){
  const target = settings.weeklyTarget || 501;
  const thisWeek = startOfWeek(new Date());
  const weeks = [];
  for (let i=0; i<count; i++){
    const ws = addDays(thisWeek, -7*i);
    const dates = [];
    for (let j=0;j<7;j++) dates.push(toISO(addDays(ws,j)));
    const wEntries = entries.filter(e => dates.includes(e.date));
    const agg = weekAgg(wEntries);
    const label = fmtDayMonth(ws) + ' – ' + fmtDayMonth(addDays(ws,6));
    const pct = target > 0 ? Math.round((agg.total/target)*100) : 0;
    weeks.push({ label, total: agg.total, pct });
  }
  return weeks;
}

async function saveDay(date){
  const typeEl = document.getElementById('day-type-value');
  let dayType = typeEl ? typeEl.value : 'worked';
  const note = document.getElementById('in-note').value || null;

  // Merge with existing entry — partial saves won't lose previously saved fields
  const existing = entries.find(e => e.date === date) || {};
  let newEntry;

  if (dayType === 'rdo'){
    newEntry = { date, rdo: true, dayOff: false, note };
  } else if (dayType === 'leave'){
    newEntry = { date, dayOff: true, rdo: false, note };
  } else {
    const startTimeVal = document.getElementById('in-starttime').value;
    const startKmVal   = document.getElementById('in-startkm').value;
    const endKmVal     = document.getElementById('in-endkm').value;
    const hoursVal     = document.getElementById('in-hours').value;
    const minsVal      = document.getElementById('in-mins').value;
    const tripsVal     = document.getElementById('in-trips').value;
    const fareVal      = document.getElementById('in-fare').value;
    const promoVal     = document.getElementById('in-promo').value;
    const tipsVal      = document.getElementById('in-tips').value;

    newEntry = {
      date, dayOff: false, rdo: false,
      startTime:     startTimeVal !== '' ? startTimeVal           : (existing.startTime     || null),
      startKm:       startKmVal   !== '' ? parseFloat(startKmVal) : (existing.startKm       != null ? existing.startKm : null),
      endKm:         endKmVal     !== '' ? parseFloat(endKmVal)   : (existing.endKm         != null ? existing.endKm   : null),
      onlineHours:   hoursVal     !== '' ? parseFloat(hoursVal)   : (existing.onlineHours   || 0),
      onlineMinutes: minsVal      !== '' ? parseFloat(minsVal)    : (existing.onlineMinutes || 0),
      trips:         tripsVal     !== '' ? Math.round(parseFloat(tripsVal)) : (existing.trips || 0),
      netFare:       fareVal      !== '' ? parseFloat(fareVal)    : (existing.netFare       || 0),
      promotions:    promoVal     !== '' ? parseFloat(promoVal)   : (existing.promotions    || 0),
      tips:          tipsVal      !== '' ? parseFloat(tipsVal)    : (existing.tips          || 0),
      note
    };
  }
  entries = entries.filter(e => e.date !== date);
  entries.push(newEntry);
  entries.sort((a,b) => a.date.localeCompare(b.date));
  activeDate = null;
  render();
  await sbUpsert(newEntry);
}

function askDelete(date){
  if (pendingDelete === date){ deleteDay(date); }
  else { pendingDelete = date; render(); }
}

async function deleteDay(date){
  entries = entries.filter(e => e.date !== date);
  pendingDelete = null; activeDate = null;
  render();
  await sbDelete(date);
}

function changeWeek(delta){
  weekStart = addDays(weekStart, delta*7);
  activeDate = null; pendingDelete = null;
  render();
}

function toggleEditTarget(){ editingTarget = !editingTarget; render(); }

async function saveTarget(){
  const v = parseFloat(document.getElementById('in-target').value);
  if (!isNaN(v) && v > 0){
    settings.weeklyTarget = v;
    const ok = await persistSettings();
    editingTarget = false;
  } else { editingTarget = false; }
  render();
}

function onSyncPillClick(){
  if (syncState.syncing) return;
  loadData().then(() => { render(); updateSyncPill(); });
}

function fmtSyncTime(iso){
  if (!iso) return 'never';
  const d = new Date(iso);
  const now = new Date();
  const diffMin = Math.round((now - d) / 60000);
  if (diffMin < 1) return 'just now';
  if (diffMin < 60) return diffMin + 'm ago';
  const diffHr = Math.round(diffMin / 60);
  if (diffHr < 24) return diffHr + 'h ago';
  return fmtDayMonth(d);
}


// ── Export CSV ─────────────────────────────────────────────────────────────
function exportCSV(){
  const rows = [['Date','Day off','Start time','Start km','Finish km','Distance km','Online hours','Online minutes','Trips','Net fare','Promotions','Tips','Total earnings','Notes']];
  entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const der = computeDerived(e);
    rows.push([
      e.date, e.dayOff ? 'Yes' : 'No', e.startTime||'', e.startKm!=null?e.startKm:'', e.endKm!=null?e.endKm:'',
      der.distance!=null?der.distance:'', e.onlineHours||0, e.onlineMinutes||0, e.trips||0,
      (e.netFare||0).toFixed(2), (e.promotions||0).toFixed(2), (e.tips||0).toFixed(2), der.total.toFixed(2),
      e.note ? '"'+e.note.replace(/"/g,'""')+'"' : ''
    ]);
  });
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'putea-shift-log.csv';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ── Monthly aggregation ────────────────────────────────────────────────────
function monthsHistory(count){
  const now = new Date();
  const months = [];
  for (let i = 0; i < count; i++){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const year = d.getFullYear();
    const month = d.getMonth();
    const label = d.toLocaleDateString('en-NZ', { month: 'long', year: 'numeric' });
    const shortLabel = d.toLocaleDateString('en-NZ', { month: 'short', year: '2-digit' });
    const mEntries = entries.filter(e => {
      const ed = parseISO(e.date);
      return ed.getFullYear() === year && ed.getMonth() === month && !e.dayOff;
    });
    const agg = weekAgg(mEntries);
    months.push({ label, shortLabel, year, month, ...agg, daysWorked: mEntries.length });
  }
  return months;
}

// ── Dashboard ──────────────────────────────────────────────────────────────
function renderDashboard(){
  const tys = taxYearStart(new Date());
  const ytdEntries = entries.filter(e => parseISO(e.date) >= tys && !e.dayOff);
  const ytd = weekAgg(ytdEntries);
  const kmPct = Math.min(100, Math.round((ytd.sumDistance / KM_TIER1_THRESHOLD) * 100));
  const kmRemaining = Math.max(KM_TIER1_THRESHOLD - ytd.sumDistance, 0);
  const att = computeAttendance(tys);

  // Monthly view — current month
  const now = new Date();
  const thisMonthEntries = entries.filter(e => {
    const d = parseISO(e.date);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && !e.dayOff;
  });
  const thisMonth = weekAgg(thisMonthEntries);
  const monthLabel = now.toLocaleDateString('en-NZ', { month: 'long', year: 'numeric' });
  const monthTarget = (settings.weeklyTarget || 501) * 4;
  const monthPct = monthTarget > 0 ? Math.min(100, Math.round((thisMonth.total / monthTarget) * 100)) : 0;

  // Last 4 weeks
  const weeks = weeksTrend(4);

  // Monthly history (last 6 months)
  const monthHistory = monthsHistory(6);

  let html = '';

  // YTD hero
  html += `
    <div class="hero">
      <div class="amount">${money(ytd.total,0)}</div>
      <div class="caption">Since 1 Apr ${tys.getFullYear()} · ${ytd.sumTrips} trips · ${Math.round(ytd.sumDistance).toLocaleString()} km</div>
    </div>
  `;

  // Key metrics row — YTD
  const ytdTripsPerHr = ytd.sumOnline > 0 ? (ytd.sumTrips / ytd.sumOnline).toFixed(1) : '—';
  const ytdPerKm = ytd.perKm ? money(ytd.perKm) : '—';
  const ytdAvgPerShift = att.worked > 0 ? money(ytd.total / att.worked, 0) : '—';
  html += `
    <div class="panel" style="padding:14px 18px;">
      <div class="panel-label" style="margin-bottom:12px;">Year to date averages</div>
      <div class="attend-row">
        <div class="attend-stat">
          <div class="n" style="font-size:22px;">${money(ytd.hourly,2)}</div>
          <div class="l">per hour</div>
        </div>
        <div class="attend-stat">
          <div class="n" style="font-size:22px;">${ytdAvgPerShift}</div>
          <div class="l">per shift</div>
        </div>
        <div class="attend-stat">
          <div class="n" style="font-size:22px;">${ytdTripsPerHr}</div>
          <div class="l">trips/hr</div>
        </div>
        <div class="attend-stat">
          <div class="n" style="font-size:22px;">${ytdPerKm}</div>
          <div class="l">per km</div>
        </div>
      </div>
    </div>
  `;

  // This month panel
  const mTripsPerHr = thisMonth.sumOnline > 0 ? (thisMonth.sumTrips / thisMonth.sumOnline).toFixed(1) : '—';
  const mAvgPerShift = thisMonthEntries.length > 0 ? money(thisMonth.total / thisMonthEntries.length, 0) : '—';
  html += `
    <div class="panel">
      <div class="panel-label">${monthLabel}</div>
      <div class="panel-figs">${money(thisMonth.total,0)} <span class="of">${thisMonthEntries.length} days · ${thisMonth.sumTrips} trips</span></div>
      <div class="track"><div class="fill${monthPct >= 100 ? ' good' : ''}" style="width:${monthPct}%"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:14px;color:var(--ink);">
        <span>${money(thisMonth.hourly)}/hr</span>
        <span>${mAvgPerShift}/shift</span>
        <span>${mTripsPerHr} trips/hr</span>
        <span>${Math.round(thisMonth.sumDistance).toLocaleString()} km</span>
      </div>
    </div>
  `;

  // Weekly average & leave tracker calculations
  const BREAK_EVEN = settings.weeklyTarget || 501;
  const ANNUAL_WORKING_WEEKS = 52;
  const DAYS_PER_WEEK = 6; // Mon–Sat, Sunday always off

  // Weekly breakdown (tax year)
  const tyWeeks = {};
  ytdEntries.forEach(e => {
    const d = parseISO(e.date);
    const mon = new Date(d);
    mon.setDate(d.getDate() - d.getDay() + (d.getDay() === 0 ? -6 : 1));
    const key = toISO(mon);
    if (!tyWeeks[key]) tyWeeks[key] = { total: 0, days: 0 };
    tyWeeks[key].total += (e.netFare||0) + (e.promotions||0) + (e.tips||0);
    tyWeeks[key].days += 1;
  });
  const weekValues = Object.values(tyWeeks);
  const drivingWeeks = weekValues.length;
  const avgWeekly = drivingWeeks > 0 ? ytd.total / drivingWeeks : 0;
  const dailyAvg = att.worked > 0 ? ytd.total / att.worked : 0;
  const weeksAbove = weekValues.filter(w => w.total >= BREAK_EVEN).length;
  const weeksBelowTarget = weekValues.filter(w => w.total < BREAK_EVEN).length;

  // Leave capacity
  const maxWeeksOff = ANNUAL_WORKING_WEEKS - (ANNUAL_WORKING_WEEKS * BREAK_EVEN / (avgWeekly || 1));
  const maxDaysOff = Math.floor(maxWeeksOff * DAYS_PER_WEEK);
  const daysOffTaken = att.off; // days explicitly marked as day off
  const leaveDaysTaken = att.off;  // only actual leave, not RDOs
  const daysOffRemaining = Math.max(maxDaysOff - leaveDaysTaken, 0);
  const weekOffCost = dailyAvg * DAYS_PER_WEEK;
  const leavePct = maxDaysOff > 0 ? Math.min(100, Math.round((leaveDaysTaken / maxDaysOff) * 100)) : 0;

  // Weekly average panel
  html += `
    <div class="panel">
      <div class="panel-label">Weekly average (${drivingWeeks} weeks driven)</div>
      <div class="panel-figs">${money(avgWeekly, 0)} <span class="of">avg per week</span></div>
      <div class="track"><div class="fill${avgWeekly >= BREAK_EVEN ? ' good' : ''}" style="width:${Math.min(100, Math.round((avgWeekly/BREAK_EVEN)*100))}%"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:14px;color:var(--ink);">
        <span>${money(dailyAvg,0)}/day avg</span>
        <span style="color:var(--green);">${weeksAbove} wks above</span>
        <span style="color:var(--red);">${weeksBelowTarget} wks below</span>
      </div>
    </div>
  `;

  // Leave tracker panel
  html += `
    <div class="panel">
      <div class="panel-label">Leave entitlement (Mon–Sat, excl Sundays)</div>
      <div class="panel-figs">${daysOffRemaining} <span class="of">days remaining of ${maxDaysOff}</span></div>
      <div class="track"><div class="fill${leavePct >= 80 ? '' : ' good'}" style="width:${leavePct}%"></div></div>
      <div style="margin-top:12px;">
        <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;color:var(--ink);margin-bottom:6px;">
          <span>Leave days taken</span><span>${leaveDaysTaken}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;color:var(--ink);margin-bottom:6px;">
          <span>Days off remaining</span><span>${daysOffRemaining}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;color:var(--ink);margin-bottom:6px;">
          <span>= weeks off available</span><span>${(daysOffRemaining / DAYS_PER_WEEK).toFixed(1)} weeks</span>
        </div>
        <div style="border-top:1px dashed var(--rule);padding-top:10px;margin-top:6px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;color:var(--ink-soft);">
          <span>Cost of 1 week off</span><span>${money(weekOffCost, 0)} lost earnings</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;color:var(--ink-soft);margin-top:4px;">
          <span>Min days/week to break even</span><span>${Math.ceil(BREAK_EVEN / dailyAvg)} days</span>
        </div>
      </div>
    </div>
  `;

  // IRD km tracker
  html += `
    <div class="panel">
      <div class="panel-label">IRD Tier 1 km threshold</div>
      <div class="panel-figs">${Math.round(ytd.sumDistance).toLocaleString()} km <span class="of">of ${KM_TIER1_THRESHOLD.toLocaleString()}</span></div>
      <div class="track"><div class="fill" style="width:${kmPct}%"></div></div>
      <div class="panel-caption">${Math.round(kmRemaining).toLocaleString()} km remaining at the $1.17 rate</div>
    </div>
  `;

  // Attendance
  html += `
    <div class="panel">
      <div class="panel-label">Days since 1 Apr ${tys.getFullYear()}</div>
      <div class="attend-row">
        <div class="attend-stat"><div class="n">${att.worked}</div><div class="l">Worked</div></div>
        <div class="attend-stat"><div class="n" style="color:var(--blue);">${att.rdo}</div><div class="l">RDO</div></div>
        <div class="attend-stat"><div class="n" style="color:var(--amber);">${att.off}</div><div class="l">Leave</div></div>
        <div class="attend-stat"><div class="n" style="color:var(--ink-soft);font-size:20px;">${att.notLogged}</div><div class="l">Not logged</div></div>
      </div>
    </div>
  `;

  // Last 4 weeks
  html += `<div class="panel-label" style="margin:22px 2px 10px;">Last 4 weeks</div>`;
  weeks.forEach(w => {
    const fillPct = Math.min(100, w.pct);
    const cls = w.pct >= 100 ? 'fill good' : 'fill';
    html += `
      <div class="weekbar">
        <div class="weekbar-top"><span>${w.label}</span><span>${money(w.total,0)}</span></div>
        <div class="track"><div class="${cls}" style="width:${fillPct}%"></div></div>
      </div>
    `;
  });

  // Monthly history
  html += `<div class="panel-label" style="margin:22px 2px 10px;">Monthly history</div>`;
  monthHistory.forEach((m, i) => {
    const isCurrentMonth = i === 0;
    const mAvg = m.daysWorked > 0 ? money(m.total / m.daysWorked, 0) : '—';
    html += `
      <div class="weekbar">
        <div class="weekbar-top">
          <span>${m.label}${isCurrentMonth ? ' <span style="color:var(--amber);font-size:13px;">now</span>' : ''}</span>

          <span>${money(m.hourly)}/hr</span>

          <span>${Math.round(m.sumDistance).toLocaleString()} km</span>
        </div>
      </div>
    `;
  });

  return html;
}

// ── Main render ────────────────────────────────────────────────────────────
function render(){
  const tys = taxYearStart(new Date());
  const ytdEntries = entries.filter(e => parseISO(e.date) >= tys);
  const ytdStrip = weekAgg(ytdEntries.filter(e => !e.dayOff && !e.rdo));

  let html = '';



  html += `
    <div class="ytd">
      <span class="lbl">Since 1 Apr ${tys.getFullYear()}</span>
      <span class="figs">
        <span>${Math.round(ytdStrip.sumDistance)} km</span><span>${ytdStrip.sumTrips} trips</span><span>${money(ytdStrip.total,0)}</span>
      </span>
    </div>
    <div class="tabs">
      <button class="tab ${view==='week'?'active':''}" onclick="setView('week')">This week</button>
      <button class="tab ${view==='dashboard'?'active':''}" onclick="setView('dashboard')">Dashboard</button>
    </div>
  `;

  if (view === 'dashboard'){
    html += renderDashboard();
  } else {
    const weekDates = [];
    for (let i=0;i<7;i++) weekDates.push(toISO(addDays(weekStart,i)));
    const weekEntries = entries.filter(e => weekDates.includes(e.date));
    const agg = weekAgg(weekEntries.filter(e => !e.dayOff));
    const target = settings.weeklyTarget || 501;
    const pct = target > 0 ? Math.round((agg.total / target) * 100) : 0;
    const fillPct = Math.min(pct, 100);
    const fillClass = pct >= 100 ? 'fill good' : 'fill';
    const rangeLabel = fmtDayMonth(addDays(weekStart,0)) + ' – ' + fmtDayMonth(addDays(weekStart,6));

    html += `
      <div class="weeknav">
        <button onclick="changeWeek(-1)">‹</button>
        <div class="range">Week of ${rangeLabel}</div>
        <button onclick="changeWeek(1)">›</button>
      </div>
      <div class="hero">
        <div class="amount">${money(agg.total, 0)}</div>
        <div class="caption">${money(agg.total)} of ${money(target,0)} target · ${pct}%</div>
        <div class="track"><div class="${fillClass}" style="width:${fillPct}%"></div></div>
        <div class="subline">${agg.sumTrips} trips · ${hoursLabel(agg.sumOnline)} online · ${money(agg.hourly)}/hr avg</div>
        ${agg.sumDistance > 0 ? `<div class="subline">${Math.round(agg.sumDistance)} km · ${agg.perKm?money(agg.perKm)+'/km':''}</div>` : ''}
      </div>
    `;

    weekDates.forEach(date => {
      const d = parseISO(date);
      const entry = weekEntries.find(e => e.date === date);
      const wk = fmtWeekday(d);
      const dt = fmtDayMonth(d);

      if (entry && entry.rdo){
        html += `
          <div class="day-row" onclick="openDay('${date}')">
            <div class="day-left"><div class="wk">${wk}</div><div class="dt">${dt}</div></div>
            <div class="day-right">
              <div class="day-off" style="color:var(--blue);">RDO</div>
              ${entry.note ? `<div class="day-off-note">${entry.note}</div>` : ''}
            </div>
          </div>
        `;
        if (activeDate === date) html += formHtml(date, entry);
      } else if (entry && entry.dayOff){
        html += `
          <div class="day-row" onclick="openDay('${date}')">
            <div class="day-left"><div class="wk">${wk}</div><div class="dt">${dt}</div></div>
            <div class="day-right">
              <div class="day-off">Leave Day</div>
              ${entry.note ? `<div class="day-off-note">${entry.note}</div>` : ''}
            </div>
          </div>
        `;
        if (activeDate === date) html += formHtml(date, entry);
      } else if (entry){
        const der = computeDerived(entry);
        html += `
          <div class="day-row" onclick="openDay('${date}')">
            <div class="day-left"><div class="wk">${wk}</div><div class="dt">${dt}</div></div>
            <div class="day-right">
              <div class="tot">${money(der.total)}</div>
              <div class="meta">${entry.trips||0} trips · ${hoursLabel(der.onlineDecimal)} · ${money(der.hourly)}/hr</div>
              ${der.distance ? `<div class="meta">${der.distance} km · ${der.perKm?money(der.perKm)+'/km':''}</div>` : ''}
              ${entry.promotions ? `<div class="promo">+${money(entry.promotions)} promo</div>` : ''}
            </div>
          </div>
        `;
        if (activeDate === date) html += formHtml(date, entry);
      } else {
        html += `
          <div class="day-row" onclick="openDay('${date}')">
            <div class="day-left"><div class="wk">${wk}</div><div class="dt">${dt}</div></div>
            <div class="day-right"><div class="not-logged">Log this day</div></div>
          </div>
        `;
        if (activeDate === date) html += formHtml(date, null);
      }
    });
  }

  html += `
    <div class="settings">
      ${editingTarget
        ? `<span>Weekly target <input type="number" id="in-target" value="${settings.weeklyTarget||501}"></span><button class="change" onclick="saveTarget()">Save</button>`
        : `<span>Weekly target ${money(settings.weeklyTarget||501,0)}</span><button class="change" onclick="toggleEditTarget()">Change</button>`
      }
    </div>
    <div class="settings">
      <span>${entries.length} day${entries.length===1?'':'s'} logged in total</span>
      <button class="export" onclick="exportCSV()">Export CSV</button>
    </div>
  `;

  document.getElementById('app').innerHTML = html;
  updateSyncPill();
}

// ── Init ───────────────────────────────────────────────────────────────────
(async function init(){
  document.getElementById('app').innerHTML = '<p class="loading">Loading shifts…</p>';
  await loadData();
  render();
  updateSyncPill();
})();
</script>
</body>
</html>
