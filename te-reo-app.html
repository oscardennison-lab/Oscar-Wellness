    {ctx:"Asking who gave the talk",eng:"Who gave that talk?",reo:"Nā wai tērā kōrero?",grammar:"Nā wai = who (active attribution — who produced/gave it). Tērā = that (further away)."},
    {ctx:"Explaining mission ownership",eng:"Whose mission is this? It is God's.",reo:"Nō wai tēnei mīhana? Nō te Atua.",grammar:"Nō wai = whose (permanent — belongs to God). Answer: Nō te Atua = God's. A powerful framing for teaching mission purpose."},
   ]},
  {id:"ch9_D",label:"D\nKaraipiture",type:"scripture",
   verses:[
    {ref:"Ko Te Pukapuka a Moromona — 2 Nīfai 25:23",mri:"He mā tātou, nā tōna aroha.",eng:"It is for us, through his love.",notes:"Mā tātou = for us (inclusive beneficiary). Nā tōna aroha = through his love (nā = by means of, active). Two ownership particles in one short phrase."},
    {ref:"LDS — Gospel Purpose",mri:"Nā wai ēnei akoranga? Nā Ihu Karaiti. Mā wai? Mā tātou katoa.",eng:"Whose are these teachings? Christ's. For whom? For all of us.",notes:"Question-answer pattern for opening a lesson. Nā wai = active attribution (Christ taught these). Mā wai = beneficiary (all of us receive them)."},
   ]},
  {id:"ch9_E",label:"E\nTono",type:"apply",
   title:"Tono Mihinare — Apply Chapter 9",
   tasks:[
    {num:1,title:"Three Questions Drill",body:"Ask all three about the same object — Ko Te Pukapuka a Moromona:\n1. Nō wai tēnei pukapuka?\n2. Nā wai i tuhituhi?\n3. Mā wai?\nAnswer all three. Then do the same for: te karakia, ngā akoranga, tō kāinga."},
    {num:2,title:"Ward Application",body:"This Sunday: when someone shows or gives you something, ask 'Nō wai tēnei?' or 'Mā wai tēnei?' in te reo Māori. The response will be real, spontaneous reo — bring it back for the debrief."},
   ]},
 ]
},

{id:"ch10",num:10,
 title_mri:"Ngā Kupu Ora: He, Kāore, Ehara",
 title_eng:"Existential Words — There Is / There Isn't",
 subtitle:"He (there is) · Kāore he (there is none) · E ai ana (it is declared) · Existence in testimony",
 sections:[
  {id:"ch10_A",label:"A\nWhaka-mārama",type:"explain",
   intro:"Tagalog uses May/Mayroon/Wala for existence. Te reo Māori uses 'he' for existence (there is a...) as well as classification. Context tells you which. Kāore he negates existence. E ai ana is the formal declaration used in testimony.",
   blocks:[
    {title:"HE — There is a... (existential)",
     body:"\u003cspan class='hl'\u003eHe\u003c/span\u003e [noun] [location/context] = there is a [noun].\nDistinguish from He [noun] [subject] = it is a type of [noun] (classification).",
     examples:[
      {mri:"\u003cspan class='hl'\u003eHe\u003c/span\u003e ara e ahu ana ki te ora tonutanga.",eng:"There is a path leading to eternal life.",note:"Existential — there is a path"},
      {mri:"\u003cspan class='hl'\u003eHe\u003c/span\u003e poropiti i runga i te whenua i tēnei wā.",eng:"There is a prophet on the earth at this time.",note:"Existential — stating something exists"},
     ]},
    {title:"KĀORE HE — There is no...",
     body:"\u003cspan class='hl'\u003eKāore he\u003c/span\u003e + noun = there is no [noun]. Negates existence.",
     examples:[
      {mri:"\u003cspan class='hl'\u003eKāore he\u003c/span\u003e ara atu i konei.",eng:"There is no other way from here.",note:"Existential negation"},
      {mri:"\u003cspan class='hl'\u003eKāore he\u003c/span\u003e tikanga o ērā kōrero.",eng:"There is no meaning in those words.",note:"The meaning doesn't exist"},
     ]},
    {title:"HE MAHA / HE TOKOMAHA — There are many",
     body:"\u003cspan class='hl'\u003eHe maha\u003c/span\u003e = many things (inanimate). \u003cspan class='hl'\u003eHe tokomaha\u003c/span\u003e = many people (animate). The animate/inanimate distinction is important throughout te reo Māori.",
     examples:[
      {mri:"\u003cspan class='hl'\u003eHe maha\u003c/span\u003e ngā tikanga o te rongopai.",eng:"There are many principles of the gospel.",note:"Maha = many inanimate things"},
      {mri:"\u003cspan class='hl'\u003eHe tokomaha\u003c/span\u003e ngā tāngata e whakaaro ana ki tēnei.",eng:"There are many people thinking about this.",note:"Tokomaha = many animate people"},
     ]},
    {title:"E AI ANA — It is declared / There exists (formal testimony)",
     body:"\u003cspan class='hl'\u003eE ai ana\u003c/span\u003e = it is declared that / there is reportedly. Used in formal speech, testimony, and declarations of truth.",
     examples:[
      {mri:"\u003cspan class='hl'\u003eE ai ana\u003c/span\u003e ko Ihu Karaiti tō tātou Kaiwhakaora.",eng:"It is declared: Jesus Christ is our Saviour.",note:"Formal assertion — testimony and declarations"},
     ]},
   ]},
  {id:"ch10_B",label:"B\nWhaka-mātau",type:"activity_mc",
   questions:[
    {q:"'He poropiti i runga i te whenua i tēnei wā' — what does this mean?",ctx:"He as existential",
     opts:["A prophet is from the earth","There is a prophet on the earth at this time","The prophet lives in this time","Is there a prophet here?"],ans:1,
     fb:"He [noun] [location] = there is a [noun]. He poropiti = there is a prophet. i runga i te whenua = on the earth. i tēnei wā = at this time."},
    {q:"'There are no other gods' — correct form?",ctx:"Existential negation",
     opts:["He kore atu ngā atua.","Kāore he atua atu.","Ehara ngā atua i ēnei.","He kore ngā atua."],ans:1,
     fb:"Kāore he [noun] = there is/are no [noun]. Atu = other/beyond. Kāore he atua atu = there are no other gods. Ehara negates identity sentences, not existence."},
    {q:"Difference between 'He maha' and 'He tokomaha'?",ctx:"Animate vs inanimate",
     opts:["He maha = a few; He tokomaha = very many","He maha = many things; He tokomaha = many people","He maha = some people; He tokomaha = all people","No difference"],ans:1,
     fb:"He maha = many inanimate things. He tokomaha = many animate people (toko- = animate prefix). This distinction runs throughout te reo Māori."},
    {q:"Formally declaring 'There is a God' in testimony — most powerful?",ctx:"Formal existential for testimony",
     opts:["Kei te Atua.","He Atua.","E ai ana he Atua.","Ko Atua tēnei."],ans:2,
     fb:"E ai ana he Atua = It is declared / there exists a God. E ai ana adds formal declaration quality — it announces a truth. He Atua alone is correct but less emphatic."},
    {q:"Asking a ward member 'Do you have a Book of Mormon at home?'",ctx:"Existence question",
     opts:["He Pukapuka a Moromona āu i tō kāinga?","Nō wai te Pukapuka a Moromona?","E ai ana he Pukapuka a Moromona?","Ko te Pukapuka a Moromona tōu?"],ans:0,
     fb:"He [thing] āu = is there a [thing] of yours? (existence question). Rising intonation makes it a question. i tō kāinga = at your home."},
    {q:"Translate: 'Kāore he ara atu i konei — ko Ihu Karaiti anake.'",ctx:"Existential negation + Ko identification",
     opts:["There is no other path from here — only Jesus Christ","Jesus Christ is the only path here","From here, all paths lead to Christ","There are many paths but only Christ"],ans:0,
     fb:"Kāore he ara atu i konei = there is no other path from here. Ko Ihu Karaiti anake = only Christ (ko = identity, anake = only). A powerful testimony statement."},
   ]},
  {id:"ch10_C",label:"C\nKōrero",type:"activity_speak",
   drills:[
    {ctx:"Testimony — living prophet",eng:"There is a prophet on the earth today.",reo:"He poropiti i runga i te whenua i tēnei rā.",grammar:"He [noun] = there is a [noun] (existential). i runga i te whenua = on the earth. i tēnei rā = today."},
    {ctx:"Explaining uniqueness of this church",eng:"There is no other church with this authority.",reo:"Kāore he hāhi atu e whai ana i tēnei mana.",grammar:"Kāore he = there is no. Hāhi atu = other church. E whai ana = that has/possesses (ongoing). Tēnei mana = this authority."},
    {ctx:"Teaching about gospel principles",eng:"There are many principles in the gospel of Jesus Christ.",reo:"He maha ngā tikanga i roto i te rongopai o Ihu Karaiti.",grammar:"He maha = there are many (inanimate). i roto i = inside/within. O Ihu Karaiti = of Jesus Christ (ō-category)."},
    {ctx:"Formal testimony declaration",eng:"There is a God — He is our Heavenly Father.",reo:"E ai ana he Atua — ko Ia tō tātou Matua i te Rangi.",grammar:"E ai ana = it is declared (formal). He Atua = a God (existential). Ko Ia = He IS (ko + pronoun). Tō tātou = ō-category."},

// ═══ APP STATE ═══
let APP={view:'menu',ci:0,si:0,qi:0,answered:false,sel:null,qc:0,qt:0,spi:0,spr:false,ratings:[],fibdone:false};
const MC=document.getElementById('main-content');
const PILL=document.getElementById('phase-pill');

function render(){if(APP.view==='menu')renderMenu();else renderChapter();}

// ─── MENU ───────────────────────────────────────────────────
function renderMenu(){
  PILL.textContent='Āpitihanga';
  const items=CHAPTERS.map((ch,i)=>{
    const p=getProgress(ch.id);const tot=ch.sections.length;const done=p.done.length;
    const pct=Math.round((done/tot)*100);const comp=done>=tot;
    return `\u003cdiv class="ch-item ${comp?'completed':''}" onclick="openCh(${i})"\u003e
\u003cdiv class="ch-num"\u003e${ch.num}\u003c/div\u003e
\u003cdiv class="ch-info"\u003e\u003cdiv class="ci-title"\u003e${ch.title_mri}\u003c/div\u003e\u003cdiv class="ci-sub"\u003e${ch.title_eng} · ${ch.subtitle}\u003c/div\u003e\u003c/div\u003e
\u003cdiv class="${comp?'ch-prog':''}"\u003e ${comp?'✓':done>0?pct+'%':'→'}\u003c/div\u003e\u003c/div\u003e`;
  }).join('');
  MC.innerHTML=`\u003cdiv id="chapter-menu" class="card"\u003e
\u003cdiv class="menu-title"\u003eTe Reo Māori · Akoranga Mihinare\u003c/div\u003e
\u003cp class="body-text muted" style="margin-bottom:18px"\u003eKo ēnei ngā akoranga mō ngā mihinare — Chapters 3–10 from the missionary language workbook, translated to te reo Māori context. Complete each chapter in order.\u003c/p\u003e
\u003cdiv class="ch-grid"\u003e${items}\u003c/div\u003e\u003c/div\u003e`;
}

function openCh(i){
  APP={view:'chapter',ci:i,si:0,qi:0,answered:false,sel:null,qc:0,qt:0,spi:0,spr:false,ratings:[],fibdone:false};
  renderChapter();
}

// ─── CHAPTER VIEW ────────────────────────────────────────────
function renderChapter(){
  const ch=CHAPTERS[APP.ci];const sec=ch.sections[APP.si];
  const p=getProgress(ch.id);
  PILL.textContent='Wahanga '+ch.num;
  const tabs=ch.sections.map((s,i)=>{
    const done=p.done.includes(s.id);const active=i===APP.si;
    return `\u003cdiv class="sn-tab ${active?'active':done?'done':''}" onclick="goSec(${i})"\u003e${s.label}\u003c/div\u003e`;
  }).join('');
  MC.innerHTML=`\u003cdiv class="back-btn" onclick="goMenu()"\u003e← Ngā Akoranga\u003c/div\u003e
\u003cdiv class="card" style="padding:15px 18px 13px;margin-bottom:12px"\u003e
\u003cspan class="eyebrow"\u003eWahanga ${ch.num}\u003c/span\u003e
\u003cdiv class="ch-title"\u003e${ch.title_mri}\u003c/div\u003e
\u003cdiv style="font-size:.8rem;color:var(--muted)"\u003e${ch.subtitle}\u003c/div\u003e\u003c/div\u003e
\u003cdiv id="sec-nav"\u003e${tabs}\u003c/div\u003e
\u003cdiv id="sec-content"\u003e\u003c/div\u003e`;
  renderSec(ch,sec);
}

function goSec(i){
  const ch=CHAPTERS[APP.ci];
  APP.si=i;APP.qi=0;APP.answered=false;APP.sel=null;APP.qc=0;APP.qt=0;APP.spi=0;APP.spr=false;APP.ratings=[];
  const sec=ch.sections[i];
  // update tabs
  const p=getProgress(ch.id);
  document.querySelectorAll('.sn-tab').forEach((t,ti)=>{
    t.className='sn-tab'+(p.done.includes(ch.sections[ti].id)&&ti!==i?' done':'')+(ti===i?' active':'');
  });
  renderSec(ch,sec);
}

function renderSec(ch,sec){
  const el=document.getElementById('sec-content');if(!el)return;
  const t=sec.type;
  if(t==='explain')el.innerHTML=renderExplain(sec);
  else if(t==='vocab')el.innerHTML=renderVocab(sec);
  else if(t==='activity_mc')el.innerHTML=renderMC(ch,sec);
  else if(t==='activity_speak')el.innerHTML=renderSpeak(ch,sec);
  else if(t==='activity_fib')el.innerHTML=renderFIB(ch,sec);
  else if(t==='dialogue')el.innerHTML=renderDialogue(sec);
  else if(t==='scripture')el.innerHTML=renderScripture(sec);
  else if(t==='apply')el.innerHTML=renderApply(sec);
}

// ─── EXPLAIN ────────────────────────────────────────────────
function renderExplain(sec){
  const d=sec;
  let h=`\u003cdiv class="card"\u003e\u003cspan class="eyebrow"\u003e${sec.label.replace('\n',' · ')}\u003c/span\u003e
\u003cdiv class="sec-title"\u003eWhakamārama — Explanation\u003c/div\u003e
\u003cp class="body-text"\u003e${d.intro||''}\u003c/p\u003e`;
  (d.blocks||[]).forEach(b=>{
    h+=`\u003cdiv class="grammar-block"\u003e\u003cspan class="gb-title"\u003e${b.title}\u003c/span\u003e`;
    if(b.body)h+=`\u003cp\u003e${b.body.replace(/\n/g,'\u003cbr\u003e')}\u003c/p\u003e`;
    if(b.table){
      h+=`\u003ctable class="gtable"\u003e\u003ctr\u003e${b.table.headers.map(x=>`\u003cth\u003e${x}\u003c/th\u003e`).join('')}\u003c/tr\u003e`;
      b.table.rows.forEach(r=>{h+=`\u003ctr\u003e${r.map(c=>`<td class="mri">${c}\u003c/td\u003e`).join('')}\u003c/tr\u003e`;});
      h+='\u003c/table\u003e';
    }
    if(b.note)h+=`\u003cdiv class="warn-block"\u003e${b.note}\u003c/div\u003e`;
    if(b.examples&&b.examples.length){
      h+='\u003cdiv class="eg-list"\u003e';
      b.examples.forEach(e=>{h+=`\u003cdiv class="eg"\u003e\u003cdiv class="mri"\u003e${e.mri}\u003c/div\u003e\u003cdiv class="eng"\u003e${e.eng}\u003c/div\u003e${e.note?`<div class="note">${e.note}</div>`:''}\u003c/div\u003e`;});
      h+='\u003c/div\u003e';
    }
    h+='\u003c/div\u003e';
  });
  if(d.examples&&d.examples.length){
    h+='\u003cdiv class="eg-list"\u003e';
    d.examples.forEach(e=>{h+=`\u003cdiv class="eg"\u003e\u003cdiv class="mri"\u003e${e.mri}\u003c/div\u003e\u003cdiv class="eng"\u003e${e.eng}\u003c/div\u003e${e.note?`<div class="note">${e.note}</div>`:''}\u003c/div\u003e`;});
    h+='\u003c/div\u003e';
  }
  h+=`\u003cdiv class="btn-row"\u003e\u003cbutton class="btn btn-primary" onclick="completeSec()"\u003eHaere tonu →\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e`;
  return h;
}

// ─── VOCAB ──────────────────────────────────────────────────
function renderVocab(sec){
  const chips=(sec.items||[]).map(v=>`\u003cdiv class="vchip"\u003e\u003cspan class="vm"\u003e${v.mri}\u003c/span\u003e\u003cspan class="ve"\u003e${v.eng}\u003c/span\u003e\u003c/div\u003e`).join('');
  return `\u003cdiv class="card"\u003e\u003cspan class="eyebrow"\u003e${sec.label.replace('\n',' · ')}\u003c/span\u003e
\u003cdiv class="sec-title"\u003eKuputaka — Vocabulary\u003c/div\u003e
\u003cp class="body-text"\u003eSay each aloud. The particles are the most important items on this list — they hold every sentence together.\u003c/p\u003e
\u003cdiv class="vocab-grid"\u003e${chips}\u003c/div\u003e
\u003cdiv class="btn-row"\u003e\u003cbutton class="btn btn-primary" onclick="completeSec()"\u003eHaere tonu →\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e`;
}

// ─── MC ─────────────────────────────────────────────────────
function renderMC(ch,sec){
  const qs=sec.questions;const qi=APP.qi;
  if(qi>=qs.length)return renderMCDone(ch,sec);
  const q=qs[qi];const K=['A','B','C','D'];
  const dots=qs.map((_,i)=>`\u003cdiv class="pdot ${i<qi?'done':i===qi?'cur':''}"\u003e\u003c/div\u003e`).join('');
  let opts=q.opts.map((o,i)=>`\u003cbutton class="opt" id="opt${i}" onclick="pickMC(${i})" ${APP.answered?'disabled':''}\u003e
\u003cdiv class="okey"\u003e${K[i]}\u003c/div\u003e\u003cdiv class="olbl"\u003e${o}\u003c/div\u003e\u003c/button\u003e`).join('');
  let fb='';
  if(APP.answered){
    const ok=APP.sel===q.ans;
    fb=`\u003cdiv class="fb show ${ok?'correct':'wrong'}"\u003e\u003cstrong\u003e${ok?'✓ Āe — Tino pai!':'✗ Kao — Whakaarohia anō'}\u003c/strong\u003e${q.fb}
${q.anatomy?`<div class="anatomy">${q.anatomy.map(a=>`<div class="an-cell"><div class="ac-reo">${a.r}</div><div class="ac-role">${a.role}</div><div class="ac-eng">${a.e}</div></div>`).join('')}</div>`:''}
\u003c/div\u003e`;
  }
  return `\u003cdiv class="card"\u003e\u003cspan class="eyebrow"\u003e${sec.label.replace('\n',' · ')}\u003c/span\u003e
\u003cdiv class="sec-title"\u003eWhakamātau — Quiz\u003c/div\u003e
\u003cdiv class="pdots"\u003e${dots}\u003c/div\u003e
\u003cdiv class="q-num"\u003ePātai ${qi+1} o ${qs.length}\u003c/div\u003e
\u003cdiv class="q-text"\u003e${q.q}\u003c/div\u003e${q.ctx?`<div class="q-ctx">${q.ctx}</div>`:''}
\u003cdiv class="opts"\u003e${opts}\u003c/div\u003e${fb}
${APP.answered?`<div class="q-nav">
<button onclick="prevMC()" ${qi===0?'disabled':''}>← Muri</button>
<span class="q-counter">${qi+1}/${qs.length}</span>
<button onclick="nextMC()">${qi===qs.length-1?'Whakakapi':'Tōmuri →'}</button></div>`:''}
\u003c/div\u003e`;
}
function pickMC(i){
  if(APP.answered)return;APP.answered=true;APP.sel=i;
  const ch=CHAPTERS[APP.ci];const sec=ch.sections[APP.si];const q=sec.questions[APP.qi];
  APP.qt++;if(i===q.ans)APP.qc++;
  renderSec(ch,sec);
  setTimeout(()=>{document.querySelectorAll('.opt').forEach((o,oi)=>{
    o.disabled=true;
    if(oi===q.ans)o.classList.add('reveal');
    if(oi===i&&i!==q.ans)o.classList.add('wrong');
  });},10);
}
function nextMC(){const ch=CHAPTERS[APP.ci];const sec=ch.sections[APP.si];if(APP.qi<sec.questions.length-1){APP.qi++;APP.answered=false;APP.sel=null;}else APP.qi=sec.questions.length;renderSec(ch,sec);}
function prevMC(){if(APP.qi>0){APP.qi--;APP.answered=false;APP.sel=null;}const ch=CHAPTERS[APP.ci];renderSec(ch,ch.sections[APP.si]);}
function renderMCDone(ch,sec){
  const pct=Math.round((APP.qc/Math.max(APP.qt,1))*100);
  const cls=pct>=80?'sb-good':pct>=60?'sb-mid':'sb-bad';
  const lbl=pct>=80?'Tino Pai!':pct>=60?'Pai':pct>=40?'Āta haere':'Redo';
  saveProgress(ch.id,sec.id,pct);
  return `\u003cdiv class="card"\u003e\u003cdiv class="score-center"\u003e
\u003cdiv class="score-big"\u003e${pct}\u003cspan\u003e%\u003c/span\u003e\u003c/div\u003e
\u003cdiv class="score-lbl"\u003e${APP.qc} / ${Math.max(APP.qt,sec.questions.length)} correct\u003c/div\u003e
\u003cdiv class="score-badge ${cls}"\u003e${lbl}\u003c/div\u003e\u003c/div\u003e
${pct<70?`<div class="warn-block"><strong>Review</strong>Score below 70% — re-read the Whakamārama section, then retry. These patterns underpin every subsequent chapter.</div>`:''}
\u003cdiv class="btn-row"\u003e\u003cbutton class="btn btn-primary" onclick="completeSec()"\u003eHaere tonu →\u003c/button\u003e${pct<80?`<button class="btn btn-outline" onclick="retryMC()">Redo Quiz</button>`:''}\u003c/div\u003e\u003c/div\u003e`;
}
function retryMC(){APP.qi=0;APP.answered=false;APP.sel=null;APP.qc=0;APP.qt=0;const ch=CHAPTERS[APP.ci];renderSec(ch,ch.sections[APP.si]);}

// ─── SPEAK ──────────────────────────────────────────────────
function renderSpeak(ch,sec){
  const ds=sec.drills;const i=APP.spi;
  if(i>=ds.length)return renderSpeakDone(ch,sec);
  const d=ds[i];const r=APP.ratings[i];
  const dots=ds.map((_,di)=>`\u003cdiv class="pdot ${di<i?'done':di===i?'cur':''}"\u003e\u003c/div\u003e`).join('');
  return `\u003cdiv class="card"\u003e\u003cspan class="eyebrow"\u003e${sec.label.replace('\n',' · ')}\u003c/span\u003e
\u003cdiv class="sec-title"\u003eKōrero — Speaking Drills\u003c/div\u003e
\u003cp class="body-text muted" style="margin-bottom:12px"\u003eSay aloud BEFORE revealing. Understand WHY each word is placed where it is.\u003c/p\u003e
\u003cdiv class="pdots"\u003e${dots}\u003c/div\u003e
\u003cdiv class="speak-card"\u003e
\u003cdiv class="sp-ctx"\u003e${d.ctx}\u003c/div\u003e
\u003cdiv class="sp-eng"\u003e${d.eng}\u003c/div\u003e
\u003cbutton class="sp-reveal-btn" onclick="toggleSpr()"\u003e${APP.spr?'Hide answer':'Say it aloud → then reveal'}\u003c/button\u003e
\u003cdiv class="sp-answer ${APP.spr?'show':''}"\u003e${d.reo}\u003c/div\u003e
\u003cdiv class="sp-grammar ${APP.spr?'show':''}"\u003e\u003cstrong\u003eGrammar\u003c/strong\u003e${d.grammar}\u003c/div\u003e
${APP.spr?`<div class="sr-row">
<button class="sr-btn sr-good ${r==='good'?'on':''}" onclick="rateSp('good')">✓ Said it</button>
<button class="sr-btn sr-mid ${r==='mid'?'on':''}" onclick="rateSp('mid')">~ Close</button>
<button class="sr-btn sr-hard ${r==='hard'?'on':''}" onclick="rateSp('hard')">✗ Blank — say 7×</button></div>`:''}
\u003c/div\u003e
\u003cdiv class="q-nav"\u003e
\u003cbutton onclick="prevSp()" ${i===0?'disabled':''}\u003e← Muri\u003c/button\u003e
\u003cspan class="q-counter"\u003e${i+1}/${ds.length}\u003c/span\u003e
\u003cbutton onclick="nextSp()" ${i===ds.length-1?'disabled':''}\u003eTōmuri →\u003c/button\u003e\u003c/div\u003e
\u003cdiv class="btn-row" style="margin-top:10px"\u003e\u003cbutton class="btn btn-primary" onclick="finishSp()"\u003eKa mutu →\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e`;
}
function toggleSpr(){APP.spr=!APP.spr;const ch=CHAPTERS[APP.ci];renderSec(ch,ch.sections[APP.si]);}
function rateSp(r){APP.ratings[APP.spi]=r;const ch=CHAPTERS[APP.ci];renderSec(ch,ch.sections[APP.si]);}
function nextSp(){if(APP.spi<CHAPTERS[APP.ci].sections[APP.si].drills.length-1){APP.spi++;APP.spr=false;}const ch=CHAPTERS[APP.ci];renderSec(ch,ch.sections[APP.si]);}
function prevSp(){if(APP.spi>0){APP.spi--;APP.spr=false;}const ch=CHAPTERS[APP.ci];renderSec(ch,ch.sections[APP.si]);}
function finishSp(){const ch=CHAPTERS[APP.ci];saveProgress(ch.id,ch.sections[APP.si].id);completeSec();}
function renderSpeakDone(ch,sec){saveProgress(ch.id,sec.id);return `\u003cdiv class="card"\u003e\u003cdiv class="done-center"\u003e\u003cdiv class="done-icon"\u003e🗣️\u003c/div\u003e\u003cdiv class="done-title"\u003eKa mutu — Kōrero Done\u003c/div\u003e\u003c/div\u003e\u003cdiv class="btn-row"\u003e\u003cbutton class="btn btn-primary" onclick="completeSec()"\u003eHaere tonu →\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e`;}

// ─── FIB ────────────────────────────────────────────────────
function renderFIB(ch,sec){
  const exs=sec.exercises;
  const inputs=exs.map((e,i)=>`\u003cdiv style="margin-bottom:16px"\u003e
\u003cdiv class="fib-sentence"\u003e${i+1}. ${e.sentence.replace('___','\u003cspan style="color:var(--teal);font-weight:700"\u003e___\u003c/span\u003e')}\u003c/div\u003e
\u003cdiv style="font-size:.77rem;color:var(--muted);margin-bottom:5px;font-style:italic"\u003e${e.translation}\u003c/div\u003e
\u003cinput class="fib-input" id="fib${i}" placeholder="Type answer…" oninput="chkFIB(${i})"\u003e
\u003cdiv id="fibfb${i}" style="font-size:.79rem;margin-top:3px;display:none"\u003e\u003c/div\u003e
\u003cdiv style="font-size:.74rem;color:var(--muted);margin-top:2px"\u003eHint: ${e.hint}\u003c/div\u003e
\u003c/div\u003e`).join('');
  return `\u003cdiv class="card"\u003e\u003cspan class="eyebrow"\u003e${sec.label.replace('\n',' · ')}\u003c/span\u003e
\u003cdiv class="sec-title"\u003eWhakauru — Fill in the Blank\u003c/div\u003e
\u003cp class="body-text"\u003e${sec.instructions}\u003c/p\u003e
${inputs}
\u003cdiv class="btn-row"\u003e\u003cbutton class="btn btn-primary" onclick="finishFIB()"\u003eKa mutu →\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e`;
}
function chkFIB(i){
  const ch=CHAPTERS[APP.ci];const sec=ch.sections[APP.si];const e=sec.exercises[i];
  const inp=document.getElementById('fib'+i);const fb=document.getElementById('fibfb'+i);
  if(!inp||!fb)return;
  const val=inp.value.trim().toLowerCase();const ans=e.answer.toLowerCase();
  if(!val){inp.className='fib-input';fb.style.display='none';return;}
  if(val===ans){inp.className='fib-input correct';fb.style.display='block';fb.style.color='var(--ok)';fb.textContent='✓ Āe — tino pai!';}
  else if(ans.startsWith(val)){inp.className='fib-input';fb.style.display='none';}
  else{inp.className='fib-input wrong';fb.style.display='block';fb.style.color='var(--err)';fb.textContent='Ko tēnei te whakautu: '+e.answer;}
}
function finishFIB(){const ch=CHAPTERS[APP.ci];saveProgress(ch.id,ch.sections[APP.si].id);completeSec();}

// ─── DIALOGUE ───────────────────────────────────────────────
function renderDialogue(sec){
  const ls=(sec.lines||[]).map(l=>`\u003cdiv class="dlg"\u003e\u003cdiv class="dlg-who ${l.wc||''}"\u003e${l.who}\u003c/div\u003e
\u003cdiv class="dlg-body"\u003e\u003cdiv class="mri"\u003e${l.mri}\u003c/div\u003e\u003cdiv class="eng"\u003e${l.eng}\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e`).join('');
  const notes=(sec.grammar_notes||[]).map(n=>`\u003cdiv style="display:flex;gap:7px;padding:6px 0;border-bottom:1px solid var(--border);font-size:.83rem"\u003e\u003cspan style="color:var(--teal);font-weight:700;flex-shrink:0"\u003e▸\u003c/span\u003e${n}\u003c/div\u003e`).join('');
  return `\u003cdiv class="card"\u003e\u003cspan class="eyebrow"\u003e${sec.label.replace('\n',' · ')}\u003c/span\u003e
\u003cdiv class="sec-title"\u003e${sec.title||'Kōrero-tahi — Dialogue'}\u003c/div\u003e
\u003cp class="body-text muted"\u003e${sec.intro||''}\u003c/p\u003e
\u003cdiv class="dialogue"\u003e${ls}\u003c/div\u003e
${notes?`<div class="grammar-block" style="margin-top:12px"><span class="gb-title">Grammar notes</span>${notes}</div>`:''}
\u003cdiv class="btn-row"\u003e\u003cbutton class="btn btn-primary" onclick="completeSec()"\u003eKa mutu →\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e`;
}

// ─── SCRIPTURE ──────────────────────────────────────────────
function renderScripture(sec){
  const vs=(sec.verses||[]).map(v=>`\u003cdiv class="scripture-box"\u003e
\u003cdiv class="sb-ref"\u003e${v.ref}\u003c/div\u003e
\u003cdiv class="sb-text"\u003e${v.mri}\u003c/div\u003e
\u003cdiv class="sb-trans"\u003e${v.eng}\u003c/div\u003e
${v.notes?`<div class="info-block" style="margin-top:7px"><strong>Grammar</strong>${v.notes}</div>`:''}
\u003c/div\u003e`).join('');
  return `\u003cdiv class="card"\u003e\u003cspan class="eyebrow"\u003e${sec.label.replace('\n',' · ')}\u003c/span\u003e
\u003cdiv class="sec-title"\u003eKaraipiture — Scripture\u003c/div\u003e
\u003cp class="body-text muted"\u003eRead each passage aloud. Identify every particle and structure from this chapter.\u003c/p\u003e
${vs}
\u003cdiv class="btn-row"\u003e\u003cbutton class="btn btn-primary" onclick="completeSec()"\u003eKa mutu →\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e`;
}

// ─── APPLY ──────────────────────────────────────────────────
function renderApply(sec){
  const ts=(sec.tasks||[]).map(t=>`\u003cdiv class="grammar-block"\u003e\u003cspan class="gb-title"\u003eMahi ${t.num}: ${t.title}\u003c/span\u003e\u003cp\u003e${t.body.replace(/\n/g,'\u003cbr\u003e')}\u003c/p\u003e\u003c/div\u003e`).join('');
  return `\u003cdiv class="card"\u003e\u003cspan class="eyebrow"\u003e${sec.label.replace('\n',' · ')}\u003c/span\u003e
\u003cdiv class="sec-title"\u003e${sec.title||'Tono Mihinare'}\u003c/div\u003e
\u003cp class="body-text"\u003eThese tasks move the language from the app into your real missionary life. They require you to speak, listen, and observe in the ward.\u003c/p\u003e
${ts}
\u003cdiv class="btn-row"\u003e\u003cbutton class="btn btn-teal" onclick="completeSec()"\u003e✓ Kua oti — Chapter Complete\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e`;
}

// ─── COMPLETE ────────────────────────────────────────────────
function completeSec(){
  const ch=CHAPTERS[APP.ci];const sec=ch.sections[APP.si];
  saveProgress(ch.id,sec.id);
  if(APP.si<ch.sections.length-1){
    APP.si++;APP.qi=0;APP.answered=false;APP.sel=null;APP.qc=0;APP.qt=0;APP.spi=0;APP.spr=false;APP.ratings=[];
    renderChapter();
  } else renderChDone(ch);
}
function renderChDone(ch){
  MC.innerHTML=`\u003cdiv class="back-btn" onclick="goMenu()"\u003e← Ngā Akoranga\u003c/div\u003e\u003cdiv class="card"\u003e
\u003cdiv class="done-center"\u003e\u003cdiv class="done-icon"\u003e✅\u003c/div\u003e
\u003cdiv class="done-title"\u003e${ch.title_mri} — Kua Oti!\u003c/div\u003e
\u003cp class="done-sub"\u003eChapter ${ch.num} complete. All sections covered.\u003c/p\u003e\u003c/div\u003e
\u003cdiv class="grammar-block"\u003e\u003cspan class="gb-title"\u003eSections completed\u003c/span\u003e
${ch.sections.map(s=>`<div style="display:flex;gap:7px;padding:4px 0;border-bottom:1px solid var(--border);font-size:.83rem"><span style="color:var(--teal)">✓</span>${s.label.replace('\n',' · ')}</div>`).join('')}
\u003c/div\u003e
\u003cdiv class="btn-row"\u003e\u003cbutton class="btn btn-primary" onclick="goMenu()"\u003e← Ngā Akoranga\u003c/button\u003e
${APP.ci<CHAPTERS.length-1?`<button class="btn btn-teal" onclick="openCh(${APP.ci+1})">Next Chapter →</button>`:''}\u003c/div\u003e\u003c/div\u003e`;
}
function goMenu(){APP.view='menu';render();}
render();

</script>
</body>
</html>
