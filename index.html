<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #18181a;
    color: #f0ede8;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    padding: 48px 24px 72px;
  }

  header {
    margin-bottom: 48px;
  }

  .label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: #555;
    margin-bottom: 14px;
  }

  h1 {
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 300;
    letter-spacing: -0.025em;
    line-height: 1.1;
    color: #f0ede8;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  @media (min-width: 540px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }

  /* Base card */
  .card {
    display: block;
    text-decoration: none;
    border-radius: 18px;
    padding: 22px 18px 20px;
    aspect-ratio: 1 / 1.05;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    cursor: pointer;
  }

  .card:hover {
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 16px 40px rgba(0,0,0,0.4);
  }

  .card:active {
    transform: scale(0.98);
  }

  /* Icon area */
  .icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon svg {
    width: 26px;
    height: 26px;
    stroke-width: 1.7;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Text */
  .card-text {}

  .card-name {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }

  .card-desc {
    font-size: 11.5px;
    font-weight: 300;
    line-height: 1.4;
    opacity: 0.72;
  }

  /* ── FRETFLOW — dark amber/green guitar app ── */
  .fretflow {
    background: #141414;
    border: 1px solid #2a2a2a;
  }
  .fretflow .icon {
    background: #3a2a0a;
  }
  .fretflow .icon svg { stroke: #E8A030; }
  .fretflow .card-name { color: #f0f0f0; }
  .fretflow .card-desc { color: #a0a0a0; }

  /* ── TE REO — dark teal Māori app ── */
  .tereo {
    background: #0e1a17;
    border: 1px solid #1e3d2e;
  }
  .tereo .icon {
    background: #0d2b1a;
  }
  .tereo .icon svg { stroke: #3ecfb8; }
  .tereo .card-name { color: #f0ede8; }
  .tereo .card-desc { color: #5a9e8a; }

  /* ── TAGALOG — navy blue Filipino app ── */
  .tagalog {
    background: #0F2744;
    border: 1px solid #1a3d6a;
  }
  .tagalog .icon {
    background: #0d1e36;
  }
  .tagalog .icon svg { stroke: #5b9cf6; }
  .tagalog .card-name { color: #E6EDF8; }
  .tagalog .card-desc { color: #7A92AA; }

  /* ── OSCAR — warm light wellness app ── */
  .oscar {
    background: #faf9f7;
    border: 1px solid #e8e4de;
  }
  .oscar .icon {
    background: rgba(200,90,26,0.10);
  }
  .oscar .icon svg { stroke: #c85a1a; }
  .oscar .card-name { color: #1a1a1a; }
  .oscar .card-desc { color: #888882; }

  /* ── PŪTEA — warm paper shift tracker ── */
  .putea {
    background: #ECEAE3;
    border: 1px solid #C7C1B2;
  }
  .putea .icon {
    background: #F3DFB2;
  }
  .putea .icon svg { stroke: #B06F00; }
  .putea .card-name { color: #20242B; }
  .putea .card-desc { color: #4B4F56; }

  /* ── PHOTOGRAPHY — warm cream photo app ── */
  .photo {
    background: #f5f4f0;
    border: 1px solid #dddbd5;
  }
  .photo .icon {
    background: rgba(160,130,10,0.10);
  }
  .photo .icon svg { stroke: #a0820a; }
  .photo .card-name { color: #1a1a1a; }
  .photo .card-desc { color: #888880; }

  /* Subtle grain texture on dark cards */
  .fretflow::after,
  .tereo::after,
  .tagalog::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    border-radius: inherit;
  }

  footer {
    margin-top: 48px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: #3a3a3a;
    letter-spacing: 0.06em;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <p class="label">index.html</p>
  <h1>Apps</h1>
</header>

<div class="grid">

  <!-- Fretflow -->
  <a class="card fretflow" href="fretflow.html">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <!-- Guitar / fretboard icon -->
        <path d="M12 2 L12 16"/>
        <circle cx="12" cy="18.5" r="2.5"/>
        <path d="M9 6 L15 6"/>
        <path d="M9 9 L15 9"/>
        <path d="M9 12 L15 12"/>
        <path d="M10 2 L14 2"/>
      </svg>
    </div>
    <div class="card-text">
      <div class="card-name">Fretflow</div>
      <div class="card-desc">Guitar & fretboard learning</div>
    </div>
  </a>

  <!-- Te Reo -->
  <a class="card tereo" href="te-reo-app.html">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <!-- Koru / language spiral -->
        <path d="M12 4 C7 4 4 7 4 11 C4 15 7 18 11 18 C14 18 16 16 16 13.5 C16 11.5 14.5 10 12.5 10 C11 10 10 11 10 12.5 C10 13.8 11 14.5 12 14.5"/>
        <path d="M12 4 L12 2"/>
      </svg>
    </div>
    <div class="card-text">
      <div class="card-name">Te Reo Māori</div>
      <div class="card-desc">He Ara Kōrero</div>
    </div>
  </a>

  <!-- Tagalog -->
  <a class="card tagalog" href="tagalog.html">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <!-- Speech/language bubbles -->
        <path d="M4 5 C4 4 5 3 6 3 L18 3 C19 3 20 4 20 5 L20 12 C20 13 19 14 18 14 L13 14 L9 17 L9 14 L6 14 C5 14 4 13 4 12 Z"/>
      </svg>
    </div>
    <div class="card-text">
      <div class="card-name">Tagalog</div>
      <div class="card-desc">Filipino language learning</div>
    </div>
  </a>

  <!-- Oscar Wellness -->
  <a class="card oscar" href="oscar_compulsion_tracker.html">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <!-- Heart with pulse -->
        <path d="M12 20 C12 20 3 14 3 8 C3 5.5 5 3.5 7.5 3.5 C9 3.5 10.5 4.5 12 6 C13.5 4.5 15 3.5 16.5 3.5 C19 3.5 21 5.5 21 8 C21 14 12 20 12 20Z"/>
      </svg>
    </div>
    <div class="card-text">
      <div class="card-name">Oscar Wellness</div>
      <div class="card-desc">Compulsion tracker</div>
    </div>
  </a>

  <!-- Pūtea Shift Log -->
  <a class="card putea" href="putea-shift-log.html">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <!-- Dollar / earnings -->
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7 L12 17"/>
        <path d="M9.5 9.5 C9.5 8.5 10.5 7.8 12 7.8 C13.5 7.8 14.5 8.6 14.5 9.6 C14.5 11.5 9.5 11 9.5 13.2 C9.5 14.3 10.5 15.2 12 15.2 C13.5 15.2 14.5 14.4 14.5 13.4"/>
      </svg>
    </div>
    <div class="card-text">
      <div class="card-name">Pūtea</div>
      <div class="card-desc">Shift earnings log</div>
    </div>
  </a>

  <!-- Photography -->
  <a class="card photo" href="Photography.html">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <!-- Camera -->
        <rect x="2" y="7" width="20" height="14" rx="3"/>
        <circle cx="12" cy="14" r="4"/>
        <path d="M8 7 L9.5 4 L14.5 4 L16 7"/>
        <circle cx="18" cy="10" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="card-text">
      <div class="card-name">Photography</div>
      <div class="card-desc">Digital Masterclass</div>
    </div>
  </a>

</div>

<footer>6 apps</footer>

</body>
</html>
